name: Trasa
options:
  bundleIdPrefix: com.example
  developmentLanguage: pl
  deploymentTarget:
    iOS: "17.0"
targets:
  Trasa:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist # generated by xcodegen
      properties:
        CFBundleDisplayName: Journey
        CFBundleShortVersionString: "1.19"
        CFBundleVersion: "23"
        CFBundleDevelopmentRegion: pl
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Aplikacja zapisuje trasę przejazdu, także gdy ekran jest wyłączony.
        NSBluetoothAlwaysUsageDescription: Journey łączy się z adapterem OBD w aucie, żeby odczytać dane silnika.
        UIBackgroundModes: [location, bluetooth-central] # the adapter keeps answering while a trip records with the screen off
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trasa
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
