name: Trasa
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Trasa:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist # generated by xcodegen
      properties:
        CFBundleDisplayName: Trasa
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Aplikacja zapisuje trasę przejazdu, także gdy ekran jest wyłączony.
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trasa
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
