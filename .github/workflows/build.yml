name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core logic check
        run: swiftc -swift-version 5 Sources/TripCore.swift Tests/main.swift -o check && ./check
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: >
          xcodebuild -project Trasa.xcodeproj -target Trasa -configuration Release -sdk iphoneos
          SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Trasa.app Payload/
          zip -r Journey.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Journey-unsigned-ipa
          path: Journey.ipa
